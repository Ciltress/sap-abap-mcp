name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - ".vscode/**"
      - "**/*.md"

permissions: {}

# Automatically cancel older in-progress jobs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu_latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test Unit
        run: npm run test

      - name: Test Types
        run: npm run test:types

  build:
    runs-on: ubuntu_latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Package
        run: npm run build
