name: sap-abap-mcp

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: sap-abap-mcp:local
    container_name: sap-abap-mcp

    ports:
      - "3000:3000"

    environment:
      TZ: Europe/Berlin
      SAP_URL: https://your-sap-server.example.com:44301
      SAP_USER: "YOUR_SAP_USER"
      SAP_CLIENT: 100
      ABAP_MCP_TRANSPORT: HTTP

